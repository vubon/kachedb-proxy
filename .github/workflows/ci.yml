name: KacheDB Proxy CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  format-and-lint:
    name: Rust Format & Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Rust Unit & Doc Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Unit Tests
        run: cargo test --verbose

  coverage:
    name: Code Coverage Verification (>= 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Coverage Gate
        run: cargo llvm-cov --all-targets --fail-under-lines 90 --lcov --output-path lcov.info

  python-e2e-and-types:
    name: Python Linters & E2E Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest requests types-requests

      - name: Run Ruff Format & Lint Checks
        run: |
          ruff format --check .
          ruff check .

      - name: Run Mypy Strict Type Check
        run: |
          mypy --strict tests/

  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        run: docker build -t kachedb-proxy:test -f Dockerfile .
