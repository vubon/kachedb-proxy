name: 🐛 Bug Report
description: File a bug report or regression in kachedb-proxy
title: "[BUG]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report for **`kachedb-proxy`**!
  - type: input
    id: version
    attributes:
      label: Proxy Version & Architecture
      description: What version of kachedb-proxy are you running? (e.g. `v0.1.0-alpha.1`, Linux x86_64, macOS Apple Silicon)
      placeholder: "v0.1.0-alpha.1 on macOS aarch64"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or `curl` command to reproduce the behavior.
      placeholder: |
        1. Start proxy with `kachedb-proxy -p 6385`
        2. Send POST `/v1/chat/completions` with payload: ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Metrics Output
      description: Copy and paste relevant logs or `curl http://localhost:6385/metrics` output.
      render: shell
