[package]
name = "kachedb-proxy"
version = "0.1.0-alpha"
edition = "2024"
authors = ["Vubon Roy <vubon.roy@gmail.com>"]
description = "High-performance OpenAI and Anthropic compatible semantic reverse proxy powered by KacheDB SIMD vector cache"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vubon/kachedb-proxy"
homepage = "https://github.com/vubon/kachedb-proxy"
readme = "README.md"
keywords = ["llm", "cache", "openai", "semantic-search", "proxy"]
categories = ["web-programming::http-server", "caching", "development-tools"]

[dependencies]
# HTTP Web Framework & Async
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures-util = "0.3"
async-stream = "0.3"

# HTTP Client for Upstream Forwarding
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Local Vector Embeddings (ONNX Runtime)
fastembed = { version = "4.9", features = ["ort-download-binaries"] }

# Serialization & CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling & Utilities
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio-test = "0.4"

[[bench]]
name = "proxy_microbenches"
harness = false
